<html lang="en">
<head>

  <title>Grant Application Portal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <img src="image/logo.png" alt="Programme Logo" class="logo">

      <div class="brand-name">
        <h2>APC Campaign Grant for All Nigerians </h2>
        <span>Application Centre</span>
      </div>
    </div>
  </header>

  <main class="main-container">

    <!-- Banner -->
    <section class="banner-section">
      <img
        src="image/banner.jpg"
        alt="Grant Programme Banner"
        class="banner-image"
      >
    </section>

    <!-- Short Write-up -->
    <section class="intro-section">
      <h1>Application Form</h1>
      <p>
        Complete the application form below using accurate information.
      </p>
    </section>

    <!-- Application Form -->
    <section class="form-section">

      <form id="applicationForm">

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="bank">Bank Name</label>
          <select id="bank" required>
            <option value="">Select your bank</option>
            <option>Access Bank</option>
            <option>First Bank</option>
            <option>GTBank</option>
            <option>UBA</option>
            <option>Zenith Bank</option>
            <option>Fidelity Bank</option>
            <option>Union Bank</option>
            <option>Stanbic IBTC</option>
            <option>OPay</option>
            <option>Moniepoint</option>
            <option>PalmPay</option>
            <option>Eco Bank</option>
            <option>Kuda</option>
            <option>FCBM</option>
              <option>Wema Bank</option>
            <option>Other</option>
            
          </select>
        </div>
<b>If Other, Add Your Bank Name<b/>
      <input type="text" placeholder="Bank Name">
    
        <div class="form-group">
          <label for="accountName">Account Name</label>
          <input
            type="text"
            id="accountName"
            placeholder="Enter account name"
            required
          >
        </div>

        <div class="form-group">
          <label for="accountNumber">Account Number</label>
          <input
            type="text"
            id="accountNumber"
            inputmode="numeric"
            maxlength="10"
            placeholder="Enter 10-digit account number"
            required
          >
        </div>

        <button type="submit" id="submitBtn">
          Submit Application
        </button>

      </form>

    </section>

    <!-- Share Button -->
    <section class="share-section">
      <button type="button" id="shareBtn">
        Share Website
      </button>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> APC Grant Application Portal</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
